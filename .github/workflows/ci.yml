name: Chronos CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ------------------------------------------------------------------
  # JOB : SAST (Analyse Statique du code Dart/Flutter)
  # CodeQL ne supporte pas Dart -> on utilise Semgrep à la place.
  # ------------------------------------------------------------------
  sast-scan:
    name: Analyse Statique Semgrep
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: semgrep scan --config auto --error --output semgrep-report.txt || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep-report.txt
          retention-days: 14

  build:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: [quality, sast-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chronos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ------------------------------------------------------------------
  # JOB : Release (uniquement déclenché par un tag "v*", ex: v1.0.0)
  # ------------------------------------------------------------------
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    needs: [quality, sast-scan, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/chronos-release.jks

      - name: Build signed release APK
        env:
          CHRONOS_KEYSTORE_PATH: ${{ runner.temp }}/chronos-release.jks
          CHRONOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHRONOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHRONOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Clean up keystore
        if: always()
        run: rm -f $RUNNER_TEMP/chronos-release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true